name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  train:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - run: python -m churn.model

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  evaluate:
    needs: train
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Write model summary
        run: |
          python - <<'PY'>> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          metrics = json.loads(
          Path("outputs/matvarden.json").read_text())

          print("## Modellutvärdering")
          print()
          print("| Mätvärde | Värde |")
          print("|---|---|")
          print(f"| ROC AUC | {metrics['roc_auc']:.4f} |")
          print(f"| Accuracy | {metrics['accuracy']:.4f} |")
          print(f"| Commit | `{metrics['commit']}` |")
          print(f"| Data SHA256 | `{metrics['data_sha256']}` |")
          PY

      - name: Evaluate model
        run: python -m churn.evaluate
